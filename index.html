<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PescaPT Live</title>
<meta name="description" content="Previsão de pesca para a costa portuguesa: meteo, mar, marés, melhor hora e espécies com tamanhos mínimos. Fishing forecast for the Portuguese coast.">
<meta name="theme-color" content="#0f2428">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta property="og:title" content="PescaPT Live">
<meta property="og:description" content="Fishing forecast for the Portuguese coast · Previsão de pesca para a costa portuguesa">
<meta property="og:image" content="screenshot.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: coluna única tipo tábua de marés; barra de separadores em baixo (Previsão · Espécies · Guia) */
:root{
  --bg:#eaf1f0; --surface:#ffffff; --surface-2:#f3f7f6; --ink:#0f2a2e; --muted:#587376; --line:#d2dfdd;
  --accent:#d9522a; --tide:#1c7486; --night:rgba(15,42,46,.06); --warn-bg:#fff4dc; --warn-ink:#7a4d00;
  --s-exc:#1f8f52; --s-good:#5aa834; --s-ok:#d39a1c; --s-weak:#e0702b; --s-bad:#c93c3c;
  --font-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-body:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px; --nav-h:62px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08181b; --surface:#0f2428; --surface-2:#132d32; --ink:#e3efed; --muted:#8aa6a8; --line:#1f3c41;
    --accent:#ff7a45; --tide:#4fc3d6; --night:rgba(0,0,0,.28); --warn-bg:#2e2410; --warn-ink:#f3c770;
    --s-exc:#3fcf7e; --s-good:#9ccc4a; --s-ok:#f0b93a; --s-weak:#f08a45; --s-bad:#ef5b5b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08181b; --surface:#0f2428; --surface-2:#132d32; --ink:#e3efed; --muted:#8aa6a8; --line:#1f3c41;
  --accent:#ff7a45; --tide:#4fc3d6; --night:rgba(0,0,0,.28); --warn-bg:#2e2410; --warn-ink:#f3c770;
  --s-exc:#3fcf7e; --s-good:#9ccc4a; --s-ok:#f0b93a; --s-weak:#f08a45; --s-bad:#ef5b5b;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font:15px/1.45 var(--font-body);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px))}
button,select{font:inherit;color:inherit}
a{color:var(--tide)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Cabeçalho */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:800 1.45rem/1 var(--font-display);letter-spacing:-.02em}
.brand b{color:var(--accent)}
.tagline{font-size:.72rem;color:var(--muted);margin-top:3px}
.top-r{display:flex;align-items:center;gap:8px}
.updated{font-size:.68rem;color:var(--muted);text-align:right;line-height:1.3}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:none;background:none;padding:5px 9px;font:700 .7rem var(--font-mono);cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* Seletor */
.zone{display:flex;gap:8px}
.select{position:relative;flex:1;min-width:0}
.select select{width:100%;appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 36px 12px 14px;font-weight:600;cursor:pointer}
.select::after{content:"";position:absolute;right:15px;top:50%;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-weight:600;font-size:.85rem;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{font-size:.8rem;color:var(--muted)}
.msg.err{color:var(--s-bad)}

/* Dias */
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 2px 7px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.day .dn{font-size:.66rem;color:var(--muted);text-transform:capitalize;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day .ds{font:700 .95rem/1 var(--font-mono)}
.day .bar{width:60%;height:4px;border-radius:2px;background:var(--line)}
.day[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}

/* Avisos */
.alert{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 12px;font-size:.84rem;display:flex;gap:10px;align-items:flex-start}
.alert b{font-weight:700}
.alert svg{flex-shrink:0;width:18px;height:18px;margin-top:1px}

/* Veredicto */
.verdict{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.verdict::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--vc,var(--line))}
.v-head{display:flex;align-items:center;gap:14px}
.gauge{width:76px;height:76px;flex-shrink:0;position:relative}
.gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.gauge .num{position:absolute;inset:0;display:grid;place-items:center;font:700 1.5rem/1 var(--font-mono)}
.v-word{font:800 1.6rem/1.05 var(--font-display);letter-spacing:-.02em;color:var(--vc);text-wrap:balance}
.v-sub{font-size:.85rem;color:var(--muted);margin-top:3px}
.windows{display:flex;flex-wrap:wrap;gap:8px}
.win{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.win small,.lbl{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.win strong{font:700 1.05rem/1.2 var(--font-mono)}
.factors{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.86rem}
.factors li{display:flex;gap:8px;align-items:flex-start}
.factors i{font-style:normal;width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font:700 .72rem/1 var(--font-mono);margin-top:1px}
.factors .p i{background:color-mix(in srgb,var(--s-exc) 18%,transparent);color:var(--s-exc)}
.factors .m i{background:color-mix(in srgb,var(--s-weak) 18%,transparent);color:var(--s-weak)}
.factors .d i{background:var(--s-bad);color:#fff}
.factors .d{font-weight:600;color:var(--s-bad)}
.astro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:12px}
.astro div{display:flex;flex-direction:column;gap:2px;min-width:0}
.astro strong{font:600 .9rem/1.2 var(--font-mono);display:flex;align-items:center;gap:6px}
.astro .moonname{font-family:var(--font-body);font-size:.8rem;min-width:0}

/* Secções */
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h2{font:700 1rem/1.2 var(--font-display);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec h2 span{font:500 .72rem var(--font-body);color:var(--muted);text-align:right}

/* Dicas */
.tips{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.tips li{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start}
.tips svg{width:20px;height:20px;color:var(--tide);margin-top:1px}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block;touch-action:manipulation}
.chart .hit{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.7rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Hora */
.hourhead{display:flex;justify-content:space-between;align-items:baseline}
.hourhead strong{font:700 1.1rem var(--font-mono)}
.hourhead span{font-size:.8rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cell{background:var(--surface-2);border-radius:10px;padding:9px 11px;min-width:0}
.cell small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.cell strong{font:600 .98rem/1.3 var(--font-mono);display:flex;align-items:center;gap:6px}
.cell em{font-style:normal;font-size:.75rem;color:var(--muted)}
.arrow{width:16px;height:16px;flex-shrink:0;color:var(--tide)}

/* Marés */
.tides{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.tide{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tide small{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tide strong{font:700 1.05rem var(--font-mono)}
.tide em{font-style:normal;font-size:.75rem;color:var(--muted);font-family:var(--font-mono)}
.tide.hi small{color:var(--tide)}
.note{font-size:.74rem;color:var(--muted)}

/* Plano B */
.alts{display:flex;flex-direction:column;gap:6px}
.alt{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:8px 10px;cursor:pointer;text-align:left;width:100%}
.alt:hover{border-color:var(--line)}
.alt .sc{font:700 1.05rem var(--font-mono);text-align:center;border-radius:8px;padding:6px 0;color:#fff}
.alt b{display:block;font-weight:600;font-size:.9rem}
.alt i{font-style:normal;font-size:.74rem;color:var(--muted)}
.alt .km{font:500 .74rem var(--font-mono);color:var(--muted)}
.alt.cur{border-color:var(--ink)}

/* Espécies */
.sp-list{display:flex;flex-direction:column;gap:8px}
.sp{display:flex;align-items:center;gap:12px;background:var(--surface-2);border:1px solid transparent;border-radius:12px;padding:8px;cursor:pointer;text-align:left;width:100%}
.sp:hover{border-color:var(--line)}
.thumb{width:66px;height:50px;border-radius:8px;object-fit:cover;background:var(--line);flex-shrink:0}
.sp-info{flex:1;min-width:0}
.sp-info b{display:block;font-weight:600}
.sp-info i{font-size:.75rem;color:var(--muted)}
.season{display:inline-block;font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--s-exc);margin-left:6px;vertical-align:2px}
.closed{color:var(--s-bad)}
.minsize{text-align:right;flex-shrink:0}
.minsize small{display:block;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.minsize strong{font:700 1.05rem var(--font-mono);color:var(--accent)}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Ficha */
dialog{border:none;padding:0;background:var(--surface);color:var(--ink);border-radius:18px;width:min(440px,calc(100% - 24px));max-height:calc(100% - 40px);margin:auto}
dialog::backdrop{background:rgba(4,14,16,.6)}
.sheet-img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--line);max-width:100%}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet-title{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-title h3{font:800 1.4rem/1.1 var(--font-display)}
.sheet-title i{font-size:.82rem;color:var(--muted)}
.big-min{background:var(--accent);color:#fff;border-radius:10px;padding:6px 10px;text-align:center;flex-shrink:0}
.big-min small{display:block;font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.big-min strong{font:700 1.15rem var(--font-mono)}
.rows{display:flex;flex-direction:column;gap:8px;font-size:.88rem}
.rows div{display:grid;grid-template-columns:92px 1fr;gap:8px}
.rows dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:2px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.months span{font:500 .6rem var(--font-mono);text-align:center;padding:3px 0;border-radius:3px;background:var(--surface-2);color:var(--muted)}
.months span.on{background:color-mix(in srgb,var(--s-exc) 25%,transparent);color:var(--ink)}
.months span.now{outline:1.5px solid var(--ink)}
.close{align-self:stretch;background:var(--ink);color:var(--bg);border:none;border-radius:10px;padding:12px;font-weight:600;cursor:pointer}
.credit{font-size:.66rem;color:var(--muted)}

/* Guia */
.guide details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:14px 16px;font:700 1rem var(--font-display);display:flex;justify-content:space-between;align-items:center;gap:10px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .2s;flex-shrink:0}
.guide details[open] summary::after{transform:rotate(-135deg)}
.guide .gbody{padding:0 16px 16px;font-size:.9rem;display:flex;flex-direction:column;gap:10px;max-width:65ch}
.guide .gbody h4{font:600 .72rem var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-top:4px}
.guide ul,.guide ol{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.guide .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.guide .kv b{font-family:var(--font-mono);font-weight:700}
.guide .links a{display:block;padding:4px 0}
.intro{font-size:.9rem;color:var(--muted);max-width:65ch}

/* Navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);height:var(--nav-h)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--accent)}

.skeleton{color:var(--muted);font-size:.85rem;padding:24px 0;text-align:center}
.errbox{border:1px solid var(--s-bad);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.foot{font-size:.7rem;color:var(--muted);text-align:center;padding-top:4px}
@media (prefers-reduced-motion: no-preference){ .gauge circle.val{transition:stroke-dashoffset .6s ease} }
@media (max-width:370px){ .day .dn{font-size:.58rem} .astro{grid-template-columns:repeat(2,minmax(0,1fr))} .updated{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">Pesca<b>PT</b> Live</div>
      <div class="tagline" data-i18n="tagline"></div>
    </div>
    <div class="top-r">
      <div class="updated" id="updated"></div>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="pt">PT</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <div class="zone" id="zoneBar">
    <div class="select">
      <label for="zoneSelect" class="sr" data-i18n="zoneLabel"></label>
      <select id="zoneSelect"></select>
    </div>
    <button class="btn" id="geoBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span data-i18n="near"></span>
    </button>
  </div>
  <div class="msg" id="geoMsg" hidden></div>

  <!-- PREVISÃO -->
  <section class="view" id="v-forecast">
    <nav class="days" id="days"></nav>
    <div id="alerts" class="view"></div>
    <div id="main" class="view"><div class="skeleton">…</div></div>
  </section>

  <!-- ESPÉCIES -->
  <section class="view" id="v-species" hidden>
    <p class="intro" id="spIntro"></p>
    <div class="filter" id="spFilter"></div>
    <div id="spAlert"></div>
    <div class="sp-list" id="speciesList"></div>
    <p class="note" id="spNote"></p>
  </section>

  <!-- GUIA -->
  <section class="view guide" id="v-guide" hidden></section>

  <p class="foot" id="foot"></p>
</div>

<nav class="nav" aria-label="Secções">
  <div class="nav-in">
    <a href="#forecast" data-view="forecast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 15c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2M2 20c2.5 0 2.5-2 5-2s2.5 2 5 2 2.5-2 5-2 2.5 2 5 2"/><circle cx="12" cy="7" r="3"/></svg><span data-i18n="tabForecast"></span></a>
    <a href="#species" data-view="species"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12c3-5 10-6 15 0-5 6-12 5-15 0zM18 12l4-3v6z"/><circle cx="8" cy="11" r="1" fill="currentColor"/></svg><span data-i18n="tabSpecies"></span></a>
    <a href="#guide" data-view="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h7z"/></svg><span data-i18n="tabGuide"></span></a>
  </div>
</nav>

<dialog id="sheet" aria-labelledby="sheetName">
  <img class="sheet-img" id="sheetImg" alt="">
  <div class="sheet-body">
    <div class="sheet-title">
      <div><h3 id="sheetName"></h3><i id="sheetSci"></i></div>
      <div class="big-min"><small data-i18n="legalMin"></small><strong id="sheetMin"></strong></div>
    </div>
    <div id="sheetAlert"></div>
    <dl class="rows" id="sheetRows"></dl>
    <div>
      <div class="note" style="margin-bottom:5px" data-i18n="bestMonths"></div>
      <div class="months" id="sheetMonths"></div>
    </div>
    <div class="credit" id="sheetCredit"></div>
    <button class="close" id="sheetClose" type="button" data-i18n="close"></button>
  </div>
</dialog>

<script>
"use strict";
/* =====================================================================
   TEXTOS PT / EN
   ===================================================================== */
const T = {
pt:{
  tagline:"Previsão de pesca para a costa portuguesa", zoneLabel:"Zona de pesca", near:"Perto",
  tabForecast:"Previsão", tabSpecies:"Espécies", tabGuide:"Guia",
  loading:"A carregar previsão para {z}…", updatedNow:"atualizado agora", updatedAgo:"atualizado há {n} min",
  errTitle:"Não foi possível obter a previsão.", errHint:"Verifica a ligação à internet e tenta de novo.", retry:"Tentar de novo",
  today:"Hoje", tomorrow:"Amanhã",

    <li><b>Maré:</b> a enchente até à preia-mar e o início da vazante dão pontos. A água parada na baixa-mar tira.</li>
    <li><b>Luz:</b> amanhecer e entardecer (90 min à volta do nascer e pôr do sol) dão pontos. Sol forte ao meio-dia tira.</li>
    <li><b>Lua:</b> marés vivas (lua nova ou cheia) dão um pequeno bónus.</li>
    <li><b>Pressão e chuva:</b> pressão a descer devagar ajuda. Chuva forte ou pressão a mudar depressa tiram pontos.</li>
  </ul>
  <p>Mar acima de 3,5 m, ou acima de 2,5 m com ondas de período longo, ou rajadas acima de 65 km/h, marcam a hora como <b>Perigosa</b>. A nota do dia é a média do melhor período de 3 horas.</p>
  <p>É uma estimativa para ajudar a decidir, não uma garantia. Quem conhece o pesqueiro sabe mais.</p>
</div></details>

<details open><summary>Before you go: licence and limits</summary><div class="gbody">
  <h4>Licence</h4>
  <p>You need a recreational fishing licence (licença de pesca lúdica) to fish with a rod in the sea. Under-16s with a licence holder don't need one.</p>
  <div class="kv"><b>€2</b><span>day</span><b>€4</b><span>month</span><b>€8</b><span>year</span></div>
  <ul>
    <li><b>Online:</b> DGRM's Portal Bmar, open to foreigners and non-residents, paid by bank transfer.</li>
    <li><b>Multibanco ATM</b> (Portuguese cards only): Pagamento de Serviços → Pagamentos ao Estado → Licença de Pesca Lúdica → Pesca Águas Marítimas e Salobras.</li>
    <li>There's no paper licence. Text <b>UPLUD</b> to 925 507 447 from the registered phone to see it.</li>
  </ul>
  <h4>How much you can keep</h4>
  <ul>
    <li><b>10 kg per day</b> of fish and cephalopods, not counting the largest specimen. Once you reach it, stop.</li>
    <li>Mussels 3 kg · oysters 5 kg · other organisms 2 kg · worms 0.5 L.</li>
    <li>Undersized fish go straight back, even if dead. Sizes are in the Species tab.</li>
    <li><b>Sea bass:</b> since January 2026 every bass you keep must be logged in the RecFishing app.</li>
  </ul>
  <h4>Tackle</h4>
  <ul>
    <li>Up to <b>3 rods</b> and <b>9 hooks</b> in total.</li>
    <li>Tagus and Sado: 2 rods and 3 hooks. Cávado, Douro, Lima and Mondego: 2 rods.</li>
    <li>Lights as attractors only when squid jigging. Banned: cliff gaffs, drones and electric fishing.</li>
  </ul>
  <h4>Protected species (partial list)</h4>
  <p>Eel, groupers, spiny and European lobster, undulate and blonde ray, several sharks, sunfish, seahorses, salmon, shads, bluefin tuna.</p>
  <h4>Closed seasons</h4>
  <p>White and two-banded seabream 1–28 February, and ballan wrasse 1 March – 31 May, for shore fishing in the Southwest Alentejo and Vicentine Coast Natural Park.</p>
  <h4>Fines</h4>
  <div class="kv"><b>€200–2000</b><span>fishing without a licence</span><b>€100–1000</b><span>undersized fish, light attractors, banned areas or distances</span></div>
  <p>Your gear can also be seized.</p>
</div></details>

<details><summary>Where you can (and can't) fish</summary><div class="gbody">
  <ul>
    <li>Banned spots are few and <b>signposted</b>. With no sign and outside protected areas, you can usually fish.</li>
    <li>Never within <b>100 m</b> of harbours, docks, shipyards, fish farms or marked sewage outfalls. On the Tagus, <b>300 m</b> from quays and terminals.</li>
    <li>Stay well away from sewage outfalls anyway: fish there can carry bacteria.</li>
    <li><b>Protected areas</b> (Arrábida, Berlengas, Southwest Alentejo and Vicentine Coast, North Coast) have zones where fishing is banned or limited.</li>
    <li><b>Bathing season:</b> many lifeguarded beaches ban fishing during bathing hours. Each harbour master (capitania) sets the rules in a public notice (edital), including night fishing on concession beaches.</li>
    <li>Temporary bans happen after pollution events. If in doubt, phone the local capitania and ask about recent notices.</li>
    <li>Keep <b>5 m</b> from other anglers unless agreed.</li>
    <li>Respect swimmers and surfers: don't cast where people are in the water.</li>
  </ul>
  <div class="links">
    <a href="https://www.dgrm.pt/zonas-de-pesca" target="_blank" rel="noopener">Fishing zones and harbour masters map (DGRM)</a>
    <a href="https://www.dgrm.pt/licenca-de-pesca-ludica" target="_blank" rel="noopener">Recreational licence (DGRM)</a>
    <a href="https://www.dgrm.pt/documents/20143/100233/texto+para+o+site+para+pedidos+de+emiss%C3%A3o+de+licen%C3%A7a+de+pesca+ludica_ING....pdf/64ebaed2-eeaa-cec3-4cbf-fcdb30080791" target="_blank" rel="noopener">How to apply for a licence, in English (DGRM, PDF)</a>
    <a href="https://dgrm.pt/documents/20143/121101/Tabela+de+Tamanhos+M%C3%ADnimos+de+Captura+30-10-25.pdf/0395af29-7e6b-8fd8-4b8a-3e29c09226e4" target="_blank" rel="noopener">Minimum sizes table (DGRM, PDF)</a>
    <a href="https://www.hidrografico.pt/" target="_blank" rel="noopener">Official tide tables (Instituto Hidrográfico)</a>
    <a href="https://pescador.azores.gov.pt/" target="_blank" rel="noopener">Azores fishing portal</a>
  </div>
</div></details>

<details><summary>Safety</summary><div class="gbody">
  <ul>
    <li><b>Watch the sea for a few minutes</b> before climbing down. Wet rock means waves reach it. Dry rock doesn't mean they won't.</li>
    <li>With swell above 2.5 m or a long period (widely spaced, powerful waves), keep off low rocks and jetties.</li>
    <li>Don't try hard-to-reach marks without experience. It's easy to get cut off by the tide, especially on spring tides.</li>
    <li>Cliffs shed rocks from above, and footholds can give way.</li>
    <li>Grippy footwear, a charged phone and someone who knows where you are. Emergency: <b>112</b>.</li>
    <li>When you hook a big fish, remember where you're standing. No fish is worth a fall.</li>
    <li>A life jacket isn't mandatory from the shore, but it's recommended.</li>
  </ul>
</div></details>

<details><summary>Tips to catch more</summary><div class="gbody">
  <ol>
    <li><b>Don't underestimate the fish.</b> They pick up sound and vibration far better than we do. Approach slowly and quietly and keep your shadow off the water, especially when it's clear. Big, noisy groups scare fish away.</li>
    <li><b>Fish close before you cast far.</b> Seabream and bass feed right by the rocks and in the surf foam. Start there. Casting far first drags your rig over the fish and spooks them.</li>
    <li><b>Fish as light and fine as you can.</b> Thinner line fools more fish, especially in clear water. Set the reel's drag so you don't lose them, and land big fish with a landing net.</li>
    <li><b>Keep the goal in mind.</b> Use the bait the fish want, not the one that's easiest to hook. Fish where the fish are, not where it's comfortable. Use the lightest weight that gets there.</li>
    <li><b>There's no magic spot.</b> A deep mark needs a big sea to make white water. With a small sea, go shallower. The same spot can be great today and dead tomorrow.</li>
    <li><b>Have a plan B.</b> Know several areas near you well, including corners sheltered from the north wind. If the sea is wrong, move. Use Plan B in the Forecast and satellite maps to find new rocks.</li>
  </ol>
</div></details>

<details><summary>Azores and Madeira</summary><div class="gbody">
  <p>The autonomous regions have their own recreational fishing laws: licence, minimum sizes, limits and protected species can differ from the mainland. The weather, sea and tide forecast works the same, but the sizes in this app are mainland values. Always check with each region's fisheries department.</p>
</div></details>

<details><summary>How the score works</summary><div class="gbody">
  <p>Each hour starts at 50 points and goes up or down with:</p>
  <ul>
    <li><b>Wind:</b> light helps, strong wind and gusts cost points.</li>
    <li><b>Swell:</b> on the open coast 0.5–1.3 m (white water) is ideal. A flat or heavy sea costs points. It matters less in estuaries.</li>
    <li><b>Tide:</b> the flood up to high water and the start of the ebb add points. Slack low water costs points.</li>
    <li><b>Light:</b> dawn and dusk (90 min around sunrise and sunset) add points. Bright midday sun costs points.</li>
    <li><b>Moon:</b> spring tides (new or full moon) give a small bonus.</li>
    <li><b>Pressure and rain:</b> slowly falling pressure helps. Heavy rain or fast pressure changes cost points.</li>
  </ul>
  <p>Seas above 3.5 m, above 2.5 m with a long period, or gusts above 65 km/h mark the hour as <b>Dangerous</b>. The day's score is the average of its best 3-hour window.</p>
  <p>It's an estimate to help you decide, not a promise. Local knowledge beats any forecast.</p>
</div></details>

function distKm(a,b,c,d){
  const rad=x=>x*Math.PI/180, dLat=rad(c-a), dLon=rad(d-b);

async function getJSON(url){
  const res = await fetch(url);
  if(!res.ok) throw new Error("HTTP "+res.status);
  const j = await res.json();
  if(j && j.error) throw new Error(j.reason||"API");
  return j;
}
const CACHE_MS = 30*60*1000;
const cacheKey = z => "pescapt-data-"+z.id;
async function fetchZones(zs){
  const tz = encodeURIComponent(zs[0].tz);
  const wURL = `https://api.open-meteo.com/v1/forecast?latitude=${zs.map(z=>z.lat).join(",")}&longitude=${zs.map(z=>z.lon).join(",")}`+
    `&hourly=temperature_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,wind_direction_10m,pressure_msl,cloud_cover`+
    `&daily=sunrise,sunset&timezone=${tz}&forecast_days=7&wind_speed_unit=kmh`;
  const mURL = `https://marine-api.open-meteo.com/v1/marine?latitude=${zs.map(z=>z.m[0]).join(",")}&longitude=${zs.map(z=>z.m[1]).join(",")}`+
    `&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature,sea_level_height_msl`+
    `&timezone=${tz}&forecast_days=7&cell_selection=sea`;
  const [w,m] = await Promise.all([getJSON(wURL), getJSON(mURL).catch(()=>null)]);
  const wa = Array.isArray(w)?w:[w], ma = m ? (Array.isArray(m)?m:[m]) : [];
  const out = {};
  zs.forEach((z,i)=>{ const d={w:wa[i], m:ma[i]||null, at:Date.now()}; out[z.id]=d; store.set(cacheKey(z), d); });
  return out;
}
async function loadZone(z, force){
  const c = store.get(cacheKey(z));
  if(!force && c && Date.now()-c.at < CACHE_MS) return c;
  return (await fetchZones([z]))[z.id];
}

function buildHours(d){
  const w=d.w.hourly, mh=d.m && d.m.hourly, mIdx={};
  if(mh) mh.time.forEach((x,i)=>mIdx[x]=i);
  const H = w.time.map((tm,i)=>{
    const j = mIdx[tm];
    const g = k => (mh && j!=null && mh[k] && mh[k][j]!=null) ? mh[k][j] : null;
    return {t:tm, date:tm.slice(0,10), h:parseInt(tm.slice(11,13)),
      temp:w.temperature_2m[i], pp:w.precipitation_probability[i]??0, pr:w.precipitation[i]??0,
      ws:w.wind_speed_10m[i]??0, wg:w.wind_gusts_10m[i]??0, wd:w.wind_direction_10m[i]??0,
      p:w.pressure_msl[i], cc:w.cloud_cover[i]??0,
      wave:g("wave_height"), wper:g("wave_period"), wdir:g("wave_direction"),
      sst:g("sea_surface_temperature"), sl:g("sea_level_height_msl")};
  });
  H.forEach((x,i)=>{ x.dp = (i>=3 && x.p!=null && H[i-3].p!=null) ? x.p-H[i-3].p : (H[i+3] && x.p!=null && H[i+3].p!=null ? H[i+3].p-x.p : null); });
  return H;
}

/* Marés: extremos da altura do mar com interpolação parabólica */
function findTides(H){
  const out=[];
  for(let i=1;i<H.length-1;i++){
    const a=H[i-1].sl,b=H[i].sl,c=H[i+1].sl;
    if(a==null||b==null||c==null) continue;
    const hi = b>a && b>=c, lo = b<a && b<=c;
    if(!hi && !lo) continue;
    const den = a-2*b+c, off = den!==0 ? clamp((a-c)/(2*den),-0.5,0.5) : 0;
    let mins = H[i].h*60 + off*60, date=H[i].date;
    if(mins<0){ date=H[i-1].date; mins+=1440; } else if(mins>=1440){ date=H[i+1].date; mins-=1440; }
    out.push({hi, fi:i+off, date, time:hm(mins), height:b-(a-c)*off/4});
  }
  return out;
}
function tideState(tides, i){
  let prev=null,next=null;
  for(const x of tides){ if(x.fi<=i) prev=x; else { next=x; break; } }
  if(!next) return null;
  return {rising:next.hi, toNext:next.fi-i, sincePrev:prev? i-prev.fi : 99, nextTime:next.time};
}

/* =====================================================================
   PONTUAÇÃO — fatores guardados como [tipo, chave, valor, vars] p/ traduzir
   ===================================================================== */
function scoreHour(x, i, ctx){
  const est = ctx.zone.t==="e";
  let s = 50; const f = [];
  const add = (v,k,vars)=>{ s+=v; f.push([v>0?"p":"m",k,v,vars||{}]); };
  const w=x.ws, wv={v:r0(w), dd:x.wd};
  if(w<=10) add(12,"f_windLight",wv);
  else if(w<=18) add(6,"f_windMod",wv);
  else if(w<=25) add(-5,"f_windFresh",wv);
  else if(w<=32) add(-15,"f_windStrong",wv);
  else add(-28,"f_windVery",wv);
  if(x.wg>55) add(-12,"f_gusts",{v:r0(x.wg)});
  if(x.wave!=null){
    const h=x.wave, hv={h};
    if(h<0.4) add(est?4:-3, est?"f_seaCalmEst":"f_seaFlat", hv);
    else if(h<=1.3) add(est?2:12, "f_seaFoam", hv);
    else if(h<=2.0) add(est?-2:2, "f_sea", hv);
    else if(h<=3.0) add(est?-6:-15, "f_seaStrong", hv);
    else add(est?-14:-30, "f_seaBig", hv);
  }
  if(x.pr>=2) add(-10,"f_rainHeavy",{v:x.pr}); else if(x.pr>=0.5) add(-3,"f_showers");
  if(x.dp!=null){
    if(x.dp<=-0.5 && x.dp>=-3) add(6,"f_pDownSlow");
    else if(x.dp<-3) add(-4,"f_pDownFast");
    else if(x.dp>2) add(-6,"f_pUpFast");
  }
  const ts = tideState(ctx.tides,i);
  if(ts){
    if(ts.rising){
      if(ts.sincePrev<1) add(-4,"f_slack");
      else if(ts.toNext<=3) add(10,"f_flood",{t:ts.nextTime});
      else add(4,"f_rising");
    } else {
      if(ts.sincePrev<=1.5) add(6,"f_ebbStart");
      else if(ts.toNext<=1) add(-6,"f_nearLow");
      else if(est) add(3,"f_ebbEst");
    }
  }
  const sun = ctx.sun[x.date];
  if(sun){
    const mm = x.h*60+30;
    if(Math.abs(mm-sun.rise)<=90) add(10,"f_dawn",{t:hm(sun.rise)});
    else if(Math.abs(mm-sun.set)<=90) add(10,"f_dusk",{t:hm(sun.set)});
    else if(x.h>=11 && x.h<=16 && x.cc<30) add(-5,"f_noon");
  }
  if(moonInfo(x.date).spring) add(4,"f_spring");
  const danger = (x.wave!=null && (x.wave>3.5 || (x.wave>2.5 && (x.wper||0)>=13))) || x.wg>65 || w>45;
  if(danger){ s=Math.min(s,15); f.unshift(["d","f_danger",-99,{}]); }
  return {s:clamp(Math.round(s),0,100), danger, f};
}
function factorText(fc){
  const v = Object.assign({}, fc[3]);
  if(v.dd!=null) v.d = dirName(v.dd);
  if(v.h!=null) v.h = f1(v.h);
  if(typeof v.v==="number" && fc[1]==="f_rainHeavy") v.v = f1(v.v);
  return t(fc[1], v);
}
function verdictOf(score, danger){
  if(danger) return {w:t("v_danger"),c:"var(--s-bad)"};
  if(score>=75) return {w:t("v_exc"),c:"var(--s-exc)"};
  if(score>=60) return {w:t("v_good"),c:"var(--s-good)"};
  if(score>=45) return {w:t("v_ok"),c:"var(--s-ok)"};
  if(score>=30) return {w:t("v_weak"),c:"var(--s-weak)"};
  return {w:t("v_bad"),c:"var(--s-bad)"};
}
const colorOf = s => s>=75?"var(--s-exc)":s>=60?"var(--s-good)":s>=45?"var(--s-ok)":s>=30?"var(--s-weak)":"var(--s-bad)";

function analyseDay(date, ctx){
  const now = ctx.now, idxs = [];
  ctx.H.forEach((x,i)=>{ if(x.date===date) idxs.push(i); });
  const usable = date===now.date ? idxs.filter(i=>ctx.H[i].h>=now.h) : idxs;
  if(!usable.length) return {score:null, windows:[], idxs, usable};
  const L = Math.min(3, usable.length), wins=[];
  for(let k=0;k<=usable.length-L;k++){
    const seg = usable.slice(k,k+L);
    wins.push({start:seg[0], len:L, mean:seg.reduce((a,i)=>a+ctx.S[i].s,0)/L, dang:seg.some(i=>ctx.S[i].danger)});
  }
  wins.sort((a,b)=>b.mean-a.mean);
  const best=[wins[0]];
  for(const w of wins){
    if(best.length>=2) break;
    if(w.mean>=45 && !w.dang && best.every(b=>Math.abs(b.start-w.start)>=3)) best.push(w);
  }
  const sn = ctx.sun[date];
  const dayH = idxs.filter(i=>{ const mm=ctx.H[i].h*60; return sn ? mm>=sn.rise-60 && mm<=sn.set : true; });
  const dangerDay = dayH.filter(i=>ctx.S[i].danger).length > dayH.length/2;
  return {score:Math.round(best[0].mean), windows:best, idxs, usable, danger:dangerDay || best[0].dang};
}
function buildCtx(z, d){
  const H = buildHours(d), tides = findTides(H), sun = {};
  d.w.daily.time.forEach((x,i)=>{ sun[x]={rise:toMin(d.w.daily.sunrise[i]), set:toMin(d.w.daily.sunset[i])}; });
  const ctx = {zone:z, H, tides, sun, dates:d.w.daily.time, at:d.at, now:nowIn(z.tz), hasMarine:!!(d.m && H.some(x=>x.wave!=null))};
  ctx.S = H.map((x,i)=>scoreHour(x,i,ctx));
  ctx.days = ctx.dates.map(dt=>analyseDay(dt,ctx));
  return ctx;
}
const winText = (ctx,w) => { const s=ctx.H[w.start].h; return [`${pad(s)}:00`, `${pad((s+w.len)%24)}:00`]; };

function tipsFor(ctx, a){
  const mid = a.windows.length ? Math.min(a.windows[0].start+1, ctx.H.length-1) : a.idxs[12] ?? a.idxs[0];
  const x = ctx.H[mid], out=[];
  const est = ctx.zone.t==="e";
  if(x.wave!=null && !est){
    if(x.wave<0.6) out.push(t("tip_flat"));
    else if(x.wave<=1.6) out.push(t("tip_foam"));
    else if(x.wave<=2.5) out.push(t("tip_rough"));
    else out.push(t("tip_big"));
  }
  if(est) out.push(t("tip_estuary"));
  if(x.ws>=18){
    const d = ((x.wd%360)+360)%360;
    const westCoast = !ctx.zone.isl && ctx.zone.r!=="G";
    if((d>=315 || d<=30) && westCoast) out.push(t("tip_north",{v:r0(x.ws)}));
    else out.push(t("tip_wind",{d:dirName(d),v:r0(x.ws)}));
  }
  const dayIdx = a.idxs;
  if(moonInfo(ctx.H[dayIdx[0]].date).spring && !est) out.push(t("tip_spring"));
  if(dayIdx.some(i=>ctx.H[i].pr>=1)) out.push(t("tip_rain"));
  if(out.length<3) out.push(t("tip_drag"));
  return out.slice(0,4);
}
function alertsFor(z, date){
  const mo = parseInt(date.slice(5,7)), out=[];
  if(mo>=6 && mo<=9) out.push(t("a_bathing"));
  if(z.f.includes("pnsacv") && mo===2) out.push(t("a_pnsacv"));
  if(z.f.includes("pnsacv") && mo>=3 && mo<=5) out.push(t("a_pnsacvB"));
  ["arrabida","berlengas","tejo","sado","river2","island"].forEach(k=>{ if(z.f.includes(k)) out.push(t("a_"+k)); });
  return out;
}

/* =====================================================================
   ESTADO E CARREGAMENTO
   ===================================================================== */
const state = { zone:null, ctx:null, day:null, hour:null, view:"forecast", alts:null, spAll:false };

function initZones(){
  const sel=$("#zoneSelect"), cur=sel.value || store.get("pescapt-zone") || "cascais";
  sel.innerHTML=""; let lastR=null, og=null;
  ZONES.forEach(z=>{
    if(z.r!==lastR){ og=document.createElement("optgroup"); og.label=T[LANG].regions[z.r]; sel.appendChild(og); lastR=z.r; }
    const o=document.createElement("option"); o.value=z.id; o.textContent=z.n; og.appendChild(o);
  });
  sel.value = ZONES.some(z=>z.id===cur) ? cur : "cascais";
}
$("#zoneSelect").addEventListener("change",()=>{ store.set("pescapt-zone",$("#zoneSelect").value); state.day=null; load(); });

async function load(force){
  const z = ZONES.find(x=>x.id===$("#zoneSelect").value);
  state.zone = z; state.alts = null;
  renderSpecies();
  $("#main").innerHTML = `<div class="skeleton">${esc(t("loading",{z:z.n}))}</div>`;
  $("#days").innerHTML = ""; $("#alerts").innerHTML = "";
  try{
    const d = await loadZone(z, force);
    if(state.zone!==z) return;
    state.ctx = buildCtx(z, d);
    const c = state.ctx;
    if(state.day==null || state.day>=c.dates.length) state.day = (c.days[0].usable.length<3 && c.dates.length>1) ? 1 : 0;
    state.hour = null;
    render();
  }catch(e){
    console.error(e);
    $("#main").innerHTML = `<div class="errbox"><strong>${t("errTitle")}</strong><span class="note">${t("errHint")} (${esc(e.message)})</span>
      <button class="btn" style="align-self:flex-start" id="retry">${t("retry")}</button></div>`;
    $("#retry").onclick=()=>load(true);
  }
}

function render(){
  if(!state.ctx) return;
  const ago = Math.round((Date.now()-state.ctx.at)/60000);
  $("#updated").textContent = ago<1 ? t("updatedNow") : t("updatedAgo",{n:ago});
  renderDays(); renderAlerts(); renderMain();
}
function renderDays(){
  const c=state.ctx;
  $("#days").innerHTML = c.dates.map((dt,i)=>{
    const a=c.days[i], col = a.score==null ? "var(--line)" : (a.danger ? "var(--s-bad)" : colorOf(a.score));
    return `<button class="day" type="button" data-d="${i}" aria-pressed="${i===state.day}" aria-label="${esc(dayLabel(dt,i))} ${a.score??""}">
      <span class="dn">${esc(dayLabel(dt,i))}${i>1?" "+parseInt(dt.slice(8,10)):""}</span>
      <span class="ds">${a.score==null?"–":a.score}</span><span class="bar" style="background:${col}"></span></button>`;
  }).join("");
  $("#days").querySelectorAll(".day").forEach(b=>b.onclick=()=>{ state.day=+b.dataset.d; state.hour=null; render(); });
}
function renderAlerts(){
  const list = alertsFor(state.zone, state.ctx.dates[state.day]);

}
function renderMain(){
  const c=state.ctx, date=c.dates[state.day], a=c.days[state.day], now=c.now, isToday = date===now.date;
  if(state.hour==null || c.H[state.hour].date!==date){
    if(isToday){ const ix=a.idxs.find(i=>c.H[i].h===now.h); state.hour = ix!=null?ix:a.idxs[0]; }
    else state.hour = a.windows.length ? a.windows[0].start+1 : a.idxs[0];
  }
  const mi = moonInfo(date), sun=c.sun[date];
  let vHTML;
  if(a.score==null){
    vHTML = `<section class="verdict" style="--vc:var(--line)"><div class="v-word" style="color:var(--muted)">${t("dayOver")}</div><div class="v-sub">${t("dayOverSub")}</div></section>`;
  } else {
    const v = verdictOf(a.score, a.danger), circ = 2*Math.PI*32, off = circ*(1-a.score/100);
    const mid = Math.min(a.windows[0].start+1, a.windows[0].start+a.windows[0].len-1);
    const fs = c.S[mid].f.filter(x=>x[0]!=="d").slice().sort((p,q)=>Math.abs(q[2])-Math.abs(p[2]));
    const pros = fs.filter(x=>x[0]==="p").slice(0,4), cons = fs.filter(x=>x[0]==="m").slice(0,2);
    const [wa,wb] = winText(c,a.windows[0]);
    const lead = a.danger ? t("leadDanger") : t(a.score>=60?"leadGo":"leadMaybe",{a:wa,b:wb}) + (isToday ? t("leadToday") : "");
    vHTML = `<section class="verdict" style="--vc:${v.c}">
      <div class="v-head">
        <div class="gauge" role="img" aria-label="${a.score}/100">
          <svg viewBox="0 0 76 76"><circle cx="38" cy="38" r="32" fill="none" stroke="var(--line)" stroke-width="7"/>
          <circle class="val" cx="38" cy="38" r="32" fill="none" stroke="${v.c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
          <div class="num">${a.score}</div>
        </div>
        <div><div class="v-word">${v.w}</div><div class="v-sub">${lead}</div></div>
      </div>
      <div class="windows">${a.windows.map((w,k)=>{ const [x1,x2]=winText(c,w); return `<div class="win"><small>${t(k===0?"bestWin":"altWin")}</small><strong>${x1}–${x2}</strong></div>`; }).join("")}</div>
      <ul class="factors">${a.danger?`<li class="d"><i>!</i>${t("dangerLine")}</li>`:""}${pros.map(x=>`<li class="p"><i>+</i>${esc(factorText(x))}</li>`).join("")}${cons.map(x=>`<li class="m"><i>−</i>${esc(factorText(x))}</li>`).join("")}</ul>
      <div class="astro">
        <div><small class="lbl">${t("sunrise")}</small><strong>${sun?hm(sun.rise):"–"}</strong></div>
        <div><small class="lbl">${t("sunset")}</small><strong>${sun?hm(sun.set):"–"}</strong></div>
        <div><small class="lbl">${t("moon")}</small><strong>${moonSVG(mi.p)}<span class="moonname">${T[LANG].moonNames[mi.idx]}</span></strong></div>
      </div>
    </section>`;
  }
  const tipsHTML = a.score==null ? "" : `<section class="sec"><h2>${t("tipsTitle")}</h2><ul class="tips">${tipsFor(c,a).map(x=>`<li>${ICON_TIP}<span>${esc(x)}</span></li>`).join("")}</ul></section>`;
  const dayTides = c.tides.filter(x=>x.date===date);
  const tidesHTML = !c.hasMarine ? `<p class="note">${t("noMarine")}</p>` :
    dayTides.length ? `<div class="tides">${dayTides.map(x=>`<div class="tide ${x.hi?"hi":""}"><small>${t(x.hi?"high":"low")}</small><strong>${x.time}</strong><br><em>${x.height>=0?"+":""}${f1(x.height)} m</em></div>`).join("")}</div>
      <p class="note">${t(mi.spring?"springNote":"neapNote")} ${t("tideNote")}</p>` : `<p class="note">${t("noTides")}</p>`;

  $("#main").innerHTML = vHTML + tipsHTML + `
    <section class="sec chart"><h2>${t("hourly")} <span>${t("tapBar")}</span></h2>${chartSVG(a,date)}
      <div class="legend"><span><i style="background:var(--s-exc)"></i>${t("lgScore")}</span><span><i style="background:var(--tide);height:3px"></i>${t("lgTide")}</span><span><i style="background:var(--night);border:1px solid var(--line)"></i>${t("lgNight")}</span></div></section>
    <section class="sec" id="hourSec">${hourHTML()}</section>
    <section class="sec"><h2>${t("tides")} <span>${t(c.zone.t==="e"?"atBar":"atCoast")}</span></h2>${tidesHTML}</section>
    <section class="sec" id="planB">${planBHTML()}</section>`;
  $("#main").querySelectorAll(".hit").forEach(el=>el.onclick=()=>{ state.hour=+el.dataset.i; updateHour(); });
  bindPlanB();
}

function chartSVG(a, date){
  const c=state.ctx, W=360, top=12, base=112, Hh=base-top, bw=W/24, sun=c.sun[date], isToday = date===c.now.date;
  let night="", bars="", hits="", labels="", tide="", nowLine="";
  if(sun){
    night += `<rect x="0" y="${top}" width="${sun.rise/60*bw}" height="${Hh}" fill="var(--night)"/>`;
    night += `<rect x="${sun.set/60*bw}" y="${top}" width="${Math.max(0,W-sun.set/60*bw)}" height="${Hh}" fill="var(--night)"/>`;
  }
  a.idxs.forEach(i=>{
    const x=c.H[i], s=c.S[i], X=x.h*bw, hgt=Math.max(3, s.s/100*(Hh-8)), past = isToday && x.h<c.now.h;
    bars += `<rect x="${X+2}" y="${base-hgt}" width="${bw-4}" height="${hgt}" rx="2" fill="${s.danger?"var(--s-bad)":colorOf(s.s)}" opacity="${past?0.3:0.9}"/>`;
    hits += `<rect class="hit" data-i="${i}" x="${X}" y="${top}" width="${bw}" height="${Hh+18}" fill="transparent"><title>${pad(x.h)}:00 · ${s.s}</title></rect>`;
  });
  for(let h=0;h<24;h+=3) labels += `<text x="${h*bw+bw/2}" y="${base+14}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--font-mono)">${pad(h)}</text>`;
  const all = c.H.map(x=>x.sl).filter(v=>v!=null);
  if(all.length>3 && a.idxs.some(i=>c.H[i].sl!=null)){
    const mn=Math.min(...all), mx=Math.max(...all), rng=(mx-mn)||1;
    const pts = a.idxs.filter(i=>c.H[i].sl!=null).map(i=>{ const x=c.H[i]; return `${(x.h*bw+bw/2).toFixed(1)},${(top+6+(1-(x.sl-mn)/rng)*(Hh*0.55)).toFixed(1)}`; }).join(" ");
    tide = `<polyline points="${pts}" fill="none" stroke="var(--tide)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  if(isToday){ const X=(c.now.h*60+c.now.m)/60*bw; nowLine=`<line x1="${X}" x2="${X}" y1="${top}" y2="${base}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>`; }
  const hx = c.H[state.hour].h*bw+0.5;
  const sel = `<rect id="selRect" x="${hx}" y="${top}" width="${bw-1}" height="${Hh}" rx="3" fill="none" stroke="var(--ink)" stroke-width="1.5"/>`;
  return `<svg viewBox="0 0 ${W} ${base+20}" role="img" aria-label="${t("hourly")}">${night}<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="var(--line)"/>${bars}${tide}${nowLine}${sel}${labels}${hits}</svg>`;
}
function hourHTML(){
  const c=state.ctx, i=state.hour, x=c.H[i], s=c.S[i], ts = tideState(c.tides,i);
  const trend = x.dp==null?"":x.dp<=-0.5?t("pDown"):x.dp>=0.5?t("pUp"):t("pStable");
  const items = s.f.slice().sort((p,q)=>Math.abs(q[2])-Math.abs(p[2])).slice(0,5);
  return `<div class="hourhead"><strong>${pad(x.h)}:00</strong><span>${t("scoreOf")} <b class="mono" style="color:${s.danger?"var(--s-bad)":colorOf(s.s)}">${s.s}</b>/100</span></div>
    <div class="grid">
      <div class="cell"><small>${t("wind")}</small><strong>${arrowSVG(x.wd)}${r0(x.ws)} km/h</strong><em>${dirName(x.wd)} · ${t("gusts")} ${r0(x.wg)}</em></div>
      <div class="cell"><small>${t("swell")}</small><strong>${x.wave!=null?f1(x.wave)+" m":"–"}</strong><em>${x.wper!=null?r0(x.wper)+" s":""}${x.wdir!=null?" · "+t("from")+" "+dirName(x.wdir):""}</em></div>
      <div class="cell"><small>${t("tide")}</small><strong>${ts?t(ts.rising?"rising":"falling"):"–"}</strong><em>${ts?t(ts.rising?"hiAt":"loAt",{t:ts.nextTime}):""}</em></div>
      <div class="cell"><small>${t("seaTemp")}</small><strong>${x.sst!=null?f1(x.sst)+" °C":"–"}</strong><em>${t("air")} ${f1(x.temp)} °C</em></div>
      <div class="cell"><small>${t("rain")}</small><strong>${x.pp}%</strong><em>${x.pr>0?f1(x.pr)+" mm":t("noRain")}</em></div>
      <div class="cell"><small>${t("pressure")}</small><strong>${x.p!=null?r0(x.p)+" hPa":"–"}</strong><em>${trend}</em></div>
    </div>
    <ul class="factors">${items.map(fc=>`<li class="${fc[0]}"><i>${fc[0]==="p"?"+":fc[0]==="d"?"!":"−"}</i>${esc(factorText(fc))}</li>`).join("")}</ul>`;
}
function updateHour(){
  const x=state.ctx.H[state.hour], r=$("#selRect");
  if(r) r.setAttribute("x", x.h*15+0.5);
  $("#hourSec").innerHTML = hourHTML();
}

/* Plano B: zonas próximas */
function neighbours(z){
  return ZONES.filter(o=>o!==z && o.tz===z.tz).map(o=>({z:o,d:distKm(z.lat,z.lon,o.lat,o.lon)}))
    .filter(o=>o.d<=100).sort((a,b)=>a.d-b.d).slice(0,5);
}
function planBHTML(){
  const head = `<h2>${t("planB")} <span>${t("planBSub")}</span></h2><p class="note">${t("planBHint")}</p>`;
  const nb = neighbours(state.zone);
  if(!nb.length) return head + `<p class="note">${t("noAlts")}</p>`;
  if(!state.alts) return head + `<button class="btn primary" id="cmpBtn" type="button">${t("compare")}</button>`;
  if(state.alts==="loading") return head + `<div class="skeleton">${t("comparing")}</div>`;
  if(state.alts.error) return head + `<p class="msg err">${t("errTitle")}</p><button class="btn" id="cmpBtn" type="button">${t("retry")}</button>`;
  const date = state.ctx.dates[state.day];
  const rows = [{z:state.zone,d:0,ctx:state.ctx}].concat(state.alts.map(x=>x)).map(o=>{
    const di = o.ctx.dates.indexOf(date); const a = di>=0 ? o.ctx.days[di] : null;
    return {...o, a};
  }).filter(o=>o.a && o.a.score!=null).sort((p,q)=>(q.a.danger?-1:q.a.score)-(p.a.danger?-1:p.a.score));
  return head + `<div class="alts">${rows.map(o=>{
    const col = o.a.danger ? "var(--s-bad)" : colorOf(o.a.score), [x1,x2]=winText(o.ctx,o.a.windows[0]);
    const mid = o.ctx.H[o.a.windows[0].start];
    const cur = o.z===state.zone;
    return `<button class="alt ${cur?"cur":""}" type="button" data-z="${o.z.id}">
      <span class="sc mono" style="background:${col}">${o.a.score}</span>
      <span><b>${esc(o.z.n)}</b><i>${x1}–${x2} · ${mid.wave!=null?f1(mid.wave)+" m · ":""}${r0(mid.ws)} km/h ${dirName(mid.wd)}</i></span>
      <span class="km">${cur?t("here"):r0(o.d)+" km"}</span></button>`;
  }).join("")}</div>`;
}
function bindPlanB(){
  const b=$("#cmpBtn"); if(b) b.onclick=comparePlanB;
  document.querySelectorAll(".alt").forEach(el=>el.onclick=()=>{
    if(el.dataset.z===state.zone.id) return;
    const keepDay = state.day;
    $("#zoneSelect").value = el.dataset.z; store.set("pescapt-zone", el.dataset.z);
    state.day = keepDay; load(); window.scrollTo({top:0,behavior:"smooth"});
  });
}
async function comparePlanB(){
  const z=state.zone, nb = neighbours(z);
  state.alts="loading"; $("#planB").innerHTML = planBHTML();
  try{
    const need = nb.filter(o=>{ const c=store.get(cacheKey(o.z)); return !(c && Date.now()-c.at<CACHE_MS); }).map(o=>o.z);
    const fresh = need.length ? await fetchZones(need) : {};
    if(state.zone!==z) return;
    state.alts = nb.map(o=>({z:o.z, d:o.d, ctx:buildCtx(o.z, fresh[o.z.id] || store.get(cacheKey(o.z)))}));
  }catch(e){ console.error(e); state.alts={error:true}; }
  $("#planB").innerHTML = planBHTML(); bindPlanB();
}

const imgCache = store.get("pescapt-img") || {};
async function speciesImg(key){
  if(imgCache[key]!==undefined) return imgCache[key];
  const sci = encodeURIComponent(SPECIES[key].sci.replace(/ /g,"_"));
  try{
    let j = await getJSON(`https://pt.wikipedia.org/api/rest_v1/page/summary/${sci}`).catch(()=>null);
    if(!j || !j.thumbnail) j = await getJSON(`https://en.wikipedia.org/api/rest_v1/page/summary/${sci}`);
    const src = j.thumbnail ? j.thumbnail.source : null;
    imgCache[key] = src ? {thumb:src, big:(j.originalimage && j.originalimage.width<=1600) ? j.originalimage.source : src.replace(/\/\d+px-/,"/640px-"), page:j.content_urls?.desktop?.page} : null;
  }catch(e){ return null; }
  store.set("pescapt-img", imgCache);
  return imgCache[key];
}
const FALLBACK = "data:image/svg+xml,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80"><rect width="120" height="80" fill="#9fb5b4"/><path d="M28 40c14-16 44-18 62 0-18 18-48 16-62 0zm62 0l16-12v24z" fill="#5f7d7e"/><circle cx="44" cy="37" r="3" fill="#eaf1f0"/></svg>`);
const isClosed = (k,z,mo) => SPECIES[k].pnsacv && z.f.includes("pnsacv") && mo===2;

function renderSpecies(){
  const z = state.zone; if(!z) return;
  const mo = nowIn(z.tz).month;
  $("#spIntro").textContent = t("spIntro");
  $("#spNote").textContent = t("spNote");
  $("#spFilter").innerHTML = `<button class="chip" type="button" data-all="0" aria-pressed="${!state.spAll}">${t("zoneSp")}: ${esc(z.n.split(" / ")[0])}</button><button class="chip" type="button" data-all="1" aria-pressed="${state.spAll}">${t("allSp")}</button>`;
  $("#spFilter").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ state.spAll = b.dataset.all==="1"; renderSpecies(); });
  $("#spAlert").innerHTML = z.isl ? `<div class="alert">${ICON_WARN}<div>${t("islandAlert")}</div></div>` : "";
  const keys = state.spAll ? Object.keys(SPECIES) : z.sp;
  const list = keys.map(k=>({k, on:SPECIES[k].peak.includes(mo), cl:isClosed(k,z,mo)}))
    .sort((a,b)=> state.spAll ? spName(a.k).localeCompare(spName(b.k),LOC()) : (b.on-a.on));
  $("#speciesList").innerHTML = list.map(({k,on,cl})=>{
    const s=SPECIES[k], sub = LANG==="en" ? `${s.pt} · <i>${s.sci}</i>` : `<i>${s.sci}</i>`;
    const tag = cl ? `<span class="season closed">${t("closedSeason")}</span>` : on ? `<span class="season">${t("inSeason")}</span>` : "";
    return `<button class="sp" type="button" data-k="${k}">
      <img class="thumb" id="th-${k}" src="${(imgCache[k]&&imgCache[k].thumb)||FALLBACK}" alt="" loading="lazy">
      <span class="sp-info"><b>${esc(spName(k))}${tag}</b><span class="note">${sub}</span></span>
      <span class="minsize"><small>${t("minShort")}</small><strong>${s.min}</strong></span></button>`;
  }).join("");
  $("#speciesList").querySelectorAll(".sp").forEach(b=>b.onclick=()=>openSheet(b.dataset.k));
  if(state.view==="species") list.forEach(async ({k})=>{ const im=await speciesImg(k); const el=document.getElementById("th-"+k); if(im && el) el.src=im.thumb; });
}
async function openSheet(k){
  const s=SPECIES[k], z=state.zone, mo=nowIn(z.tz).month;
  $("#sheetName").textContent = spName(k);
  $("#sheetSci").textContent = (LANG==="en" ? s.pt+" · " : "") + s.sci;
  $("#sheetMin").textContent = s.min + (s.minNote ? " ("+s.minNote[LANG]+")" : "");

$("#sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") $("#sheet").close(); });

const VIEWS = ["forecast","species","guide"];
function showView(v){
  if(!VIEWS.includes(v)) v="forecast";
  state.view=v;
  VIEWS.forEach(x=>$("#v-"+x).hidden = x!==v);
  $("#zoneBar").hidden = v==="guide";
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current", a.dataset.view===v?"page":"false"));
  if(v==="species") renderSpecies();
}
window.addEventListener("hashchange",()=>{ showView(location.hash.slice(1)); window.scrollTo(0,0); });

function applyLang(){
  document.documentElement.lang = LANG==="pt" ? "pt-PT" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent = t(el.dataset.i18n));
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.lang===LANG));
  $("#geoBtn").setAttribute("aria-label", t("near"));
  $("#v-guide").innerHTML = GUIDE[LANG];
  $("#foot").textContent = t("foot");
  initZones();
  if(state.ctx) render();
  renderSpecies();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ LANG=b.dataset.lang; store.set("pescapt-lang",LANG); applyLang(); });

$("#geoBtn").onclick=()=>{
  const msg=$("#geoMsg"); msg.hidden=false; msg.className="msg"; msg.textContent=t("geoAsk");
  if(!navigator.geolocation){ msg.className="msg err"; msg.textContent=t("geoNo"); return; }
  navigator.geolocation.getCurrentPosition(p=>{
    let best=null, bd=1e9;
    ZONES.forEach(z=>{ const d=distKm(p.coords.latitude,p.coords.longitude,z.lat,z.lon); if(d<bd){bd=d;best=z;} });
    $("#zoneSelect").value=best.id; store.set("pescapt-zone",best.id);
    msg.textContent = t(bd>60?"geoFar":"geoOk",{d:r0(bd), z:best.n});
    state.day=null; load();
  },()=>{ msg.className="msg err"; msg.textContent=t("geoDenied"); },{timeout:10000,maximumAge:600000});
};

/* Arranque */
applyLang();
showView(location.hash.slice(1));
load();
setInterval(()=>{ if(state.ctx && Date.now()-state.ctx.at > CACHE_MS && document.visibilityState==="visible") load(); }, 5*60*1000);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
